_format_version: "3.0"
_transform: true

services:
  - name: atrio-backend
    url: http://backend:3001
    routes:
      - name: public-login
        paths:
          - /api/v1/auth/login
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local

      - name: protected-api
        paths:
          - /api/v1
        strip_path: false
        plugins:
          - name: jwt
            config:
              cookie_names:
                - session
              claims_to_verify:
                - exp
              secret_is_base64: false

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:6006"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Correlation-ID
      credentials: true
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 60
      policy: local
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
  - name: file-log
    config:
      path: /dev/stdout

consumers:
  - username: atrio-backend
    jwt_secrets:
      - key: atrio-backend
        algorithm: HS256
        secret: change-me-in-production
