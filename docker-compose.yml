version: '3.8'

services:
  frontend:
    build:
      context: ./apps/frontend
      args:
        INTERNAL_API_URL: http://kong:8000
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_API_URL is the browser-facing base URL (the Next.js server itself).
      # All /api/* calls are rewritten server-side to Kong via next.config.js rewrites.
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - INTERNAL_API_URL=http://kong:8000
      - HOSTNAME=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      kong:
        condition: service_healthy

  backend:
    build: ./apps/backend
    # No host port binding — backend is internal only, accessed via Kong at :8000.
    expose:
      - "3001"
    environment:
      - DATABASE_URL=postgresql://atrio:atrio@postgres:5432/atrio
      - JWT_SECRET=change-me-in-production
      - JWT_ISSUER=atrio-backend
      - JWT_EXPIRES_IN=8h
      - BCRYPT_ROUNDS=10
      - NODE_ENV=development
      - PORT=3001
      - CACHE_ENABLED=true
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  kong:
    image: kong:3.6
    ports:
      - "8000:8000"
      # Admin API — dev only, not in prod compose
      - "8001:8001"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 5

  storybook:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.storybook
    ports:
      - "6006:6006"
    profiles:
      - dev
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
      - ./database/init-test-db.sh:/docker-entrypoint-initdb.d/3-init-test-db.sh
    environment:
      - POSTGRES_USER=atrio
      - POSTGRES_PASSWORD=atrio
      - POSTGRES_DB=atrio
      - POSTGRES_TEST_DB=atrio_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrio -d atrio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: